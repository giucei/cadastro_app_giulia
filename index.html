<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cadastro iFood - Projeto</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="login-wrap">
    <div class="login-card">
      <div class="avatar"> 
        <svg width="60" height="60" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4 20c0-4 4-6 8-6s8 2 8 6v0H4z" fill="#fff"/></svg>
      </div>
      <h2>USER LOGIN</h2>

      <form id="signupForm" class="form">
        <div class="field">
          <span class="icon">👤</span>
          <input id="name" name="name" type="text" placeholder="Username" required />
        </div>

        <div class="field">
          <span class="icon">🔒</span>
          <input id="password" name="password" type="password" placeholder="Password" required minlength="6" />
        </div>

        <div class="options">
          <label class="remember"><input type="checkbox"/> Remember me</label>
          <a class="forgot" href="#">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-login">LOGIN</button>
      </form>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
